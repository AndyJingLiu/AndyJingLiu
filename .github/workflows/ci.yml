name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-secret
      DATABASE_PATH: instance/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: python -m black --check app.py tests
      - name: Lint
        run: python -m flake8 app.py tests
      - name: Test
        run: python -m pytest -q
      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt
