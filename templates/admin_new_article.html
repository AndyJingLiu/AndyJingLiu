{% extends "base.html" %}
{% block content %}
<div class="page">
  <h1>New Article</h1>
  {% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}
  <form action="{{ url_for('new_article') }}" method="post" class="article-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label for="language">Language</label>
    <select id="language" name="language" required>
      <option value="zh" {% if form.language == 'zh' %}selected{% endif %}>中文</option>
      <option value="en" {% if form.language == 'en' %}selected{% endif %}>English</option>
    </select>
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ form.title }}" maxlength="200" required />
    <label for="summary">Summary (optional)</label>
    <textarea id="summary" name="summary" rows="3" maxlength="500">{{ form.summary }}</textarea>
    <label for="body">Body (Markdown)</label>
    <textarea id="body" name="body" rows="18" maxlength="100000" required>{{ form.body }}</textarea>
    <label for="image_path">Hero image path</label>
    <input type="text" id="image_path" name="image_path" value="{{ form.image_path }}" placeholder="images/article-image.webp" />
    <button type="submit" class="btn">Publish article</button>
  </form>
</div>
{% endblock %}
